services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: re-tracker-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_SA_PASSWORD}"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"${SQL_SA_PASSWORD}\" -Q \"SELECT 1\" -b -o /dev/null -C"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  api:
    build:
      context: ./src
      dockerfile: Dockerfile
    container_name: re-tracker-api
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__ReTracker: "Server=sqlserver,1433;Database=ReTracker;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;"
    ports:
      - "5000:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: on-failure

  web:
    build:
      context: ./re-tracker-web
      dockerfile: Dockerfile
    container_name: re-tracker-web
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  sqldata:
